plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rauk" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// ./gradlew runDevShot: opens a test world, photographs Rauk into run/screenshots/ and quits.
		devShot {
			client()
			configName = "Dev screenshots"
			vmArg "-Drauk.devshot=true"
			programArgs "--width", "1600", "--height", "900"
			runDir "run"
		}
	}
}

// ./gradlew paintRaukTexture: paints Rauk's texture from the model layout in RaukRig.
tasks.register("paintRaukTexture", JavaExec) {
	group = "rauk"
	description = "Paints Rauk's entity texture from the model's layout."
	classpath = sourceSets.client.runtimeClasspath
	mainClass = "rauk.com.client.model.RaukTexturePainter"
	jvmArgs "-Djava.awt.headless=true"
	args file("src/main/resources/assets/rauk/textures/entity/rauk.png").absolutePath
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// ./gradlew drawHotelPlans: draws the hotel's floor plans from HotelBuilder into docs/hotel.
tasks.register("drawHotelPlans", JavaExec) {
	group = "rauk"
	description = "Draws the hotel's floor plans."
	classpath = sourceSets.client.runtimeClasspath
	mainClass = "rauk.com.client.dev.HotelPlanPainter"
	jvmArgs "-Djava.awt.headless=true"
	args file("docs/hotel").absolutePath
}

// ./gradlew drawHotelConcept: draws the reshaped hotel as a concept for review, into docs/hotel.
tasks.register("drawHotelConcept", JavaExec) {
	group = "rauk"
	description = "Draws the concept for the reshaped hotel."
	classpath = sourceSets.client.runtimeClasspath
	mainClass = "rauk.com.client.dev.HotelConceptPainter"
	jvmArgs "-Djava.awt.headless=true"
	args file("docs/hotel").absolutePath
}

// ./gradlew auditHotel: lists the blocks out of place on the hotel's outside.
tasks.register("auditHotel", JavaExec) {
	group = "rauk"
	description = "Checks the hotel's outside for blocks out of place."
	classpath = sourceSets.client.runtimeClasspath
	mainClass = "rauk.com.client.dev.HotelAudit"
	jvmArgs "-Djava.awt.headless=true"
}

// ./gradlew paintHotelTextures: paints the hotel's block textures (and a sheet of them in docs/hotel).
tasks.register("paintHotelTextures", JavaExec) {
	group = "rauk"
	description = "Paints the hotel's block textures."
	classpath = sourceSets.client.runtimeClasspath
	mainClass = "rauk.com.client.dev.HotelTexturePainter"
	jvmArgs "-Djava.awt.headless=true"
	args file("src/main/resources/assets/rauk/textures/block").absolutePath, file("docs/hotel/materials.png").absolutePath,
			file("src/main/resources").absolutePath
}
